version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
      time: "07:15"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    groups:
      pump-fun:
        patterns:
          - "@pump-fun/*"
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - pump.fun
    ignore:
      # 0.7.0 removed the './b402' and './b402/server' exports that
      # api/_lib/bnb/mpp-server.js and mpp-buyer.js import (the b402 layer moved
      # to @bnb-chain/b402 and @bnb-chain/mpp-b402). Merging that bump 500ed the
      # BSC rail on import (2026-09-18). Lift this once the adapters are ported.
      - dependency-name: "@bnb-chain/mpp"
        versions:
          - ">=0.3.0"
