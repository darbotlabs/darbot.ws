version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
      time: "07:15"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    groups:
      pump-fun:
        patterns:
          - "@pump-fun/*"
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - pump.fun
